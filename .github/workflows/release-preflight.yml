name: Release Preflight
run-name: Release preflight ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - '.github/workflows/release-preflight.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to build without publishing
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify release dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_REF }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Codex ACP adapter version
        run: bash scripts/verify-codex-acp-version.sh --latest

      - name: Test model discovery contracts
        run: go test -count=1 ./internal/llm

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            zig_target: x86_64-linux-gnu.2.31
          - target: linux-arm64
            os: ubuntu-24.04
            goos: linux
            goarch: arm64
            zig_target: aarch64-linux-gnu.2.31
          - target: darwin-amd64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            os: macos-15
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            os: windows-2022
            goos: windows
            goarch: amd64

    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_REF }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Windows C/C++ compilers
        if: runner.os == 'Windows'
        run: |
          gcc --version
          g++ --version

      # Keep the candidate build identical to the release build: zig provides
      # the pinned glibc 2.31 baseline, and the GTK/WebKit headers are needed
      # to compile the webview backend (see scripts/buildtools/).
      - name: Install zig toolchain
        if: runner.os == 'Linux'
        run: |
          zig_version="0.14.1"
          curl -sSfL -o /tmp/zig.tar.xz "https://ziglang.org/download/${zig_version}/zig-x86_64-linux-${zig_version}.tar.xz"
          tar -C /tmp -xf /tmp/zig.tar.xz
          echo "/tmp/zig-x86_64-linux-${zig_version}" >> "${GITHUB_PATH}"
          "/tmp/zig-x86_64-linux-${zig_version}/zig" version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Linux candidate
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          mkdir -p build
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/buildtools/linux-cgo-env.sh"
          export CC="zig cc -target ${ZIG_TARGET}"
          export CXX="zig c++ -target ${ZIG_TARGET}"
          go build -trimpath \
            -tags 'sqlite_fts5 netgo osusergo' \
            -ldflags="-s -w -X main.version=release-preflight -extldflags=-Wl,-z,lazy" \
            -o build/session-insight .

      - name: Build macOS candidate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build -trimpath -tags sqlite_fts5 -ldflags='-s -w -X main.version=release-preflight' -o build/session-insight .

      - name: Build Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          go build -trimpath -tags sqlite_fts5 -ldflags='-s -w -X main.version=release-preflight' -o build/session-insight.exe .
