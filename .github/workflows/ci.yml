name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The unified binary embeds the `--app` desktop-window mode. Compiling
      # webview_go's C++ backend needs the GTK/WebKit headers on Linux; the
      # runtime WebKitGTK dependency only exists when `--app` is used (weak
      # symbols + dlopen). linux-cgo-env.sh wires the pkg-config wrapper and
      # the weak-symbol header for every Go step below.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Go environment
        run: echo "PKG_CONFIG=${GITHUB_WORKSPACE}/scripts/buildtools/pkg-config" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # go:embed frontend/dist requires a real build tree (not a stub) before Go analysis.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # goinstall builds with the setup-go toolchain so typecheck matches go.mod (1.25+).
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=5m

      - name: Run Go vet
        run: |
          # shellcheck disable=SC1091
          source scripts/buildtools/linux-cgo-env.sh
          go vet -tags sqlite_fts5 ./...

      - name: Run Go tests
        run: |
          # shellcheck disable=SC1091
          source scripts/buildtools/linux-cgo-env.sh
          go test -count=1 -tags sqlite_fts5 ./...
