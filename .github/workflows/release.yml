name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build or republish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Codex ACP adapter version
        run: bash scripts/verify-codex-acp-version.sh

      - name: Test model discovery contracts
        run: go test -count=1 ./internal/llm

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            zig_target: x86_64-linux-gnu.2.31
          - target: linux-arm64
            os: ubuntu-24.04
            goos: linux
            goarch: arm64
            zig_target: aarch64-linux-gnu.2.31
          - target: darwin-amd64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            os: macos-15
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            os: windows-2022
            goos: windows
            goarch: amd64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Windows C/C++ compilers
        if: runner.os == 'Windows'
        # webview_go compiles C++ on every platform, so g++ is required too.
        run: |
          gcc --version
          g++ --version

      # zig provides a hermetic C/C++ toolchain with a pinned glibc baseline,
      # so the Linux binaries keep running on older distributions (Ubuntu
      # 20.04 / Debian 11 era, glibc 2.31) instead of inheriting the runner's
      # glibc/libstdc++ ABI. libc++ is linked statically (no GLIBCXX runtime
      # dependency); WebKitGTK stays a runtime-only, --app-only dependency.
      - name: Install zig toolchain
        if: runner.os == 'Linux'
        run: |
          zig_version="0.14.1"
          curl -sSfL -o /tmp/zig.tar.xz "https://ziglang.org/download/${zig_version}/zig-x86_64-linux-${zig_version}.tar.xz"
          tar -C /tmp -xf /tmp/zig.tar.xz
          echo "/tmp/zig-x86_64-linux-${zig_version}" >> "${GITHUB_PATH}"
          "/tmp/zig-x86_64-linux-${zig_version}/zig" version

      # Every Linux binary now embeds the `--app` desktop-window mode without
      # hard-depending on WebKitGTK at startup (weak symbols + runtime
      # dlopen, see scripts/buildtools/). Building still needs the GTK/WebKit
      # headers; the runtime dependency only exists when `--app` is used.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build and package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          version="${RELEASE_TAG#v}"
          package="session-insight-${version}-${TARGET}"
          package_dir="dist/${package}"
          mkdir -p "${package_dir}"
          # Wire the pkg-config wrapper (4.0→4.1 alias, stripped webview link
          # flags, default include root demoted to -idirafter) and the
          # weak-symbol header; see scripts/buildtools/.
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/buildtools/linux-cgo-env.sh"
          export CC="zig cc -target ${ZIG_TARGET}"
          export CXX="zig c++ -target ${ZIG_TARGET}"
          go build -trimpath \
            -tags "sqlite_fts5 netgo osusergo" \
            -ldflags="-s -w -X main.version=${RELEASE_TAG} -extldflags=-Wl,-z,lazy" \
            -o "${package_dir}/session-insight" .
          cp README.md README_ZH.md LICENSE "${package_dir}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Build and package macOS archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${RELEASE_TAG#v}"
          package="session-insight-${version}-${TARGET}"
          package_dir="dist/${package}"
          mkdir -p "${package_dir}"
          go build -trimpath -tags sqlite_fts5 -ldflags="-s -w -X main.version=${RELEASE_TAG}" -o "${package_dir}/session-insight" .
          cp README.md README_ZH.md LICENSE "${package_dir}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Build and package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $package = "session-insight-$version-$env:TARGET"
          $packageDir = Join-Path dist $package
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          go build -trimpath -tags sqlite_fts5 -ldflags="-s -w -X main.version=$env:RELEASE_TAG" -o "$packageDir/session-insight.exe" .
          Copy-Item README.md, README_ZH.md, LICENSE -Destination $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/$package.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # Browser-mode startup smoke test on the oldest supported baseline: the
  # unified binary must start and run --maintain-index inside Ubuntu 20.04
  # (glibc 2.31), where the previous static artifact also ran. This guards
  # the zig glibc baseline against creeping back up to the runner's ABI.
  smoke-linux:
    name: Smoke test Linux binary (Ubuntu 20.04 baseline)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v7
        with:
          name: linux-amd64
          path: dist

      - name: Run browser-mode startup smoke test in Ubuntu 20.04
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tar -C dist -xzf "dist/session-insight-${version}-linux-amd64.tar.gz"
          bin="dist/session-insight-${version}-linux-amd64/session-insight"
          chmod +x "${bin}"
          docker run --rm -v "${PWD}:/work" -w /work ubuntu:20.04 \
            env SI_DATA_DIR=/tmp/si-smoke "./${bin}" --maintain-index
          echo "SMOKE-OK: binary starts on the glibc 2.31 baseline"

  publish:
    name: Publish GitHub Release
    needs: [build, smoke-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download platform archives
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum session-insight-* > checksums.txt

      # Preferred path: local "release" skill already created the GitHub Release
      # with agent-authored notes. This job then only uploads binaries.
      # Fallback: if the Release is missing (raw tag push), attach a
      # deterministic feat/fix-grouped commit list — never --generate-notes.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            exit 0
          fi

          prev="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          notes="$(mktemp)"
          {
            echo "## What's Changed"
            echo
            if [ -n "${prev}" ]; then
              range="${prev}..${RELEASE_TAG}"
            else
              range="${RELEASE_TAG}"
            fi

            feats="$(git log "${range}" --pretty=format:'%s' --no-merges | grep -E '^[Ff]eat(\(|:)' || true)"
            fixes="$(git log "${range}" --pretty=format:'%s' --no-merges | grep -E '^[Ff]ix(\(|:)|^bugfix(\(|:)' || true)"
            others="$(git log "${range}" --pretty=format:'%s' --no-merges | grep -Ev '^[Ff]eat(\(|:)|^([Ff]ix|bugfix)(\(|:)' || true)"

            if [ -n "${feats}" ]; then
              echo "### Features"
              echo
              printf '%s\n' "${feats}" | sed 's/^/- /'
              echo
            fi
            if [ -n "${fixes}" ]; then
              echo "### Bug Fixes"
              echo
              printf '%s\n' "${fixes}" | sed 's/^/- /'
              echo
            fi
            if [ -n "${others}" ]; then
              echo "### Other"
              echo
              printf '%s\n' "${others}" | sed 's/^/- /'
              echo
            fi

            if [ -n "${prev}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${RELEASE_TAG}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
            fi
            echo
            echo "_Notes were auto-grouped from commits because no pre-created Release was found. Prefer the local \`release\` skill for Highlights-quality notes._"
          } > "${notes}"

          gh release create "${RELEASE_TAG}" dist/* \
            --verify-tag \
            --notes-file "${notes}" \
            --title "Session Insight ${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}"
          rm -f "${notes}"
